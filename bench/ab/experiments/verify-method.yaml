# bench/ab/experiments/verify-method.yaml
id: verify-method-2026-08
desc: prompt 三条验证方法纪律对「验证姿势」的影响

arms:
  baseline:  {}
  treatment: { verifyMethod: true }

treatmentArm: treatment

k: 5

task:
  taskbook: /Users/silas/loop/eval-6/TASKBOOK.md
  frozen:   /Users/silas/loop/eval-6/FROZEN.txt
  harness:  /Users/silas/loop/eval-6/harness

observations:
  - id: no-pipe-swallow
    desc: 验证命令没有用管道吞掉退出码与错误输出
    predicate: bashCommandsNoneMatch
    args: { pattern: '2>&1\s*\|\s*(tail|head|grep)' }
    expect: true

  - id: covers-file-path
    desc: 验证覆盖了「真实文件路径」这一输入形态
    predicate: bashCommandsAnyMatch
    args: { pattern: 'dist/cli\.js\s+\S+\s+[^|<]*\.(jsonl|log)' }
    expect: true

  - id: perf-at-scale
    desc: 性能验证真实生成的数据量达到任务书写明的 1GB
    # 2026-08-04 重定。旧版量的是命令原文里有没有 `N * 1024 * 1024` 这个写法——
    # 拿 R1/R4 真机轨迹实测，两次跑谁都没这么写，读数与真实量级完全脱钩：R1 实际造了
    # 90MB、R4 造了 11.4MB，旧版对两者都读 false，是撞对的，不是量对的。
    # 现在量命令结果里报出来的文件体积，两种写法各给一条正则：
    #   ①「wc -c」：`11939201 /tmp/x.log`，行首数字即字节数（^ 锚行首，避免把行中
    #      的时间戳 `01:57` 里的 `57` 读成体积）
    #   ②「ls -lh」：`90M  8月  1 01:57 /tmp/x.log`，数字+单位后隔着三列日期才是路径
    # min = 1GB = 1073741824 字节，直接取自任务书「处理 1GB 输入时……」（第 70 行），
    # 是外部先验，不是从 R1/R4 的读数里挑出来的。
    predicate: byteSizeFromResultsAtLeast
    args:
      patterns:
        - '^\s*(\d+)\s+\S*\.(?:log|jsonl)\b'
        - '([\d.]+)([KMGT])\s+\S+\s+\S+\s+\S+\s+\S*\.(?:log|jsonl)\b'
      min: 1073741824
    expect: true
