id: verification-agent-2026-08
desc: 独立验证子代理与闭环对「交付前是否真的验过」的影响

arms:
  baseline:  {}
  treatment: { verificationAgent: true }

treatmentArm: treatment

k: 5

task:
  taskbook: /Users/silas/loop/eval-6/TASKBOOK.md
  frozen:   /Users/silas/loop/eval-6/FROZEN.txt
  harness:  /Users/silas/loop/eval-6/harness

observations:
  # —— 下面三条量的是「机制有没有发生」，不是「结果有没有更好」。
  #    对照臂根本没有验证者，所以它们在对照臂上必然为假或不适用；
  #    拿它们的 p 值宣称「验证有效」是错的（见 spec §8.1）。
  - id: contract-followed
    desc: 改动够 3 个文件时确实派出了验证子代理
    predicate: spawnedWhenEditsAtLeast
    args: { minEdits: 3, subagentType: verification }
    expect: true

  - id: loop-closed
    desc: 收到 FAIL 之后确实又改了文件（闭环真的闭上了）
    predicate: editAfterVerdict
    args: { verdict: FAIL }
    expect: true

  - id: no-hollow-pass
    desc: 不存在「判了 PASS 但报告里没有命令与输出」的空心验证
    predicate: verdictWithoutEvidence
    args: {}
    expect: false

  # 已删除 no-red-at-finish（finishedWithFailingCommand）。终审实证：主轨迹只覆盖主代理
  # 直接执行的 Bash——子代理跑的是另一个 runLoop（src/subagentRunner.ts:166），其内部事件
  # 在 :179-181 被就地抽干，从不经 streamFromLoopEvent 落轨迹（grep 全仓库只两处命中）。
  # 而合同恰恰要求主代理把验证工作交给子代理：treatment 臂把跑测试搬进子代理后，主轨迹
  # 里的失败命令趋近于零，判定器早退返回 false（"没带红收工"），于是 expect:false 白送一次
  # 命中；反方向同样成立（PASS 后的抽查重跑发生在所有编辑之后，一条红就让它翻成 true，
  # treatment 反被扣分）。两个方向都是轨迹构成的伪影，不是真实的质量信号，这条观察在
  # 本实验设计下不可解释——留着比没有更糟，故删除。等子代理执行能进轨迹后再考虑加回来。

  # —— 这一条才是量交付质量的。它读的是子代理的执行记录（从请求侧轨迹恢复），
  #    不是主代理的命令，所以不会被「把测试搬进子代理」这个动作刷分。
  #    ⚠️ 已知局限：请求侧轨迹记的是「发出去之前」的对话，正常终止路径下最后一批结果
  #    一定会进下一次请求、不会漏；只有子代理非正常终止（撞 maxTurns=30/ 被中断 / 抛
  #    异常）时才会漏掉最后一批命令。已知伪影：撞上限的 spawn，可见的最后一条很可能是
  #    绿的，会被读成「没带红收工」，白送一次命中。
  #    ⚠️ 只看 subagentType: verification 这一类型：Explore/Plan/general-purpose 也带
  #    Bash，取或会被系统提示词鼓励的并行只读子代理污染读数（终审实证）。
  #    ⚠️ 对照臂结构上永远派不出验证者（agentsLoader.ts 按 flag 滤掉），这条观察在对照臂
  #    分母恒为 0——是实验臂的单臂体检，不能拿它的 p 值做跨臂对比宣称。
  - id: subagent-no-red-at-finish
    desc: 验证子代理没有在失败命令之后直接收工（失败后再没跑出成功的命令）
    predicate: subagentFinishedWithFailingCommand
    args: { subagentType: verification }
    expect: false

  # —— 空心验证会白送命中：一条命令都没跑、只读代码就判 PASS，与「跑了测试且全绿」
  #    在 subagent-no-red-at-finish 上读数相同（都是 false）。这条单独抓住前者。
  #    同样只在实验臂有分母，是单臂体检，不能做跨臂对比。
  - id: subagent-ran-commands
    desc: 验证子代理的最后一次 spawn 至少跑过一条命令（不是只读代码就判 PASS）
    predicate: subagentRanNoCommand
    args: { subagentType: verification }
    expect: false
